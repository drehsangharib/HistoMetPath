schema_version: "1.0"
dataset: CAMELYON16
scientific_scope: "development-only interpretable dual-view baseline comparison"
dual_view_manifest: outputs/camelyon16/dual_view_embedding_development/dual_view_embedding_manifest.json
embedding_root: embeddings/camelyon16/dual_view_development
final_test_lock: outputs/camelyon16/final_fresh_test/FINAL_TEST_EXECUTED.lock
output_root: outputs/camelyon16/dual_view_baselines
seed: 42
views: [spatial_v2, spatial_v3]
allowed_splits: [train, validation]
prohibited_splits: [test]
logistic_regression:
  c: 1.0
  max_iter: 5000
stacking:
  folds: 5
selection_priority:
  - validation_balanced_accuracy
  - validation_auroc
  - validation_auprc
  - model_name
