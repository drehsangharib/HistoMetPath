schema_version: "1.0"
dataset: CAMELYON16
scientific_scope: "training-only slide-level uncertainty and calibration audit from repeated OOF predictions"
training_predictions: outputs/camelyon16/training_only_stability/training_only_oof_predictions.csv
training_stability_results: outputs/camelyon16/training_only_stability/training_only_stability_results.json
row_level_calibration_results: outputs/camelyon16/training_only_calibration_selective/training_only_calibration_selective.json
disagreement_audit: outputs/camelyon16/v2_concat_disagreement_audit/v2_concat_disagreement_audit.json
frozen_validation_results: outputs/camelyon16/dual_view_baselines/dual_view_baseline_results.json
final_test_lock: outputs/camelyon16/final_fresh_test/FINAL_TEST_EXECUTED.lock
output_root: outputs/camelyon16/training_only_slide_level_calibration
models:
  - spatial_v2_mean_pool_lr
  - dual_view_mean_concat_lr
expected_training_slides: 30
expected_repeats: 10
decision_threshold: 0.5
calibration_bins: 5
persistent_correct_minimum: 8
persistent_incorrect_maximum: 2
split_sensitive_minimum_std: 0.15
allowed_split: train
prohibited_splits: [validation, test]
