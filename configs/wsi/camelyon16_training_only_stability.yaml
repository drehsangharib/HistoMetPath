schema_version: "1.0"
dataset: CAMELYON16
scientific_scope: "training-only repeated stability audit of interpretable dual-view baselines"
dual_view_manifest: outputs/camelyon16/dual_view_embedding_development/dual_view_embedding_manifest.json
embedding_root: embeddings/camelyon16/dual_view_development
frozen_validation_result: outputs/camelyon16/dual_view_baselines/dual_view_baseline_results.json
final_test_lock: outputs/camelyon16/final_fresh_test/FINAL_TEST_EXECUTED.lock
output_root: outputs/camelyon16/training_only_stability
views: [spatial_v2, spatial_v3]
allowed_split: train
prohibited_splits: [validation, test]
outer_repeats: 10
outer_folds: 5
inner_stacking_folds: 3
seeds: [101, 211, 307, 401, 503, 601, 701, 809, 907, 1009]
decision_threshold: 0.5
logistic_regression:
  c: 1.0
  max_iter: 5000
ranking_priority:
  - mean_auroc
  - mean_auprc
  - mean_balanced_accuracy
  - model_name
models:
  - spatial_v2_mean_pool_lr
  - spatial_v3_mean_pool_lr
  - dual_view_mean_concat_lr
  - dual_view_late_probability_average
  - dual_view_oof_logistic_stacking
