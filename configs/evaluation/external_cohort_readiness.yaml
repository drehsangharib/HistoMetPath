schema_version: "1.0"
project: HistoMetPath
scientific_scope: "new untouched external-cohort readiness and protocol lock"
existing_processing_manifest: outputs/camelyon16/expanded_fresh_holdout/processing_manifest.json
final_test_lock: outputs/camelyon16/final_fresh_test/FINAL_TEST_EXECUTED.lock
development_decision: outputs/camelyon16/development_decision_release/development_decision.json
candidate_external_manifest: data/external_evaluation/EXTERNAL_COHORT_MANIFEST.json
output_root: outputs/external_evaluation/readiness
required_candidate_fields:
  - cohort_id
  - cohort_source
  - cohort_created_utc
  - slides
required_slide_fields:
  - slide_id
  - source_path
  - label
  - patient_id
  - acquisition_site
  - accession_or_case_id
allowed_labels: [normal, tumor]
minimum_total_slides: 20
minimum_slides_per_class: 10
require_unique_patient_ids: true
require_zero_slide_overlap: true
require_zero_patient_overlap_when_available: true
frozen_primary_model: spatial_v2_mean_pool_lr
frozen_secondary_model: dual_view_mean_concat_lr
frozen_decision_threshold_source: "existing frozen development artifacts only"
prohibit_threshold_refitting: true
prohibit_model_refitting: true
prohibit_sampler_changes: true
prohibit_encoder_changes: true
